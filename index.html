<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega SSL</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }
    main {
      text-align: center;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
    }
    .lock {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.5rem;
    }
    p {
      margin: 0.5rem 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.3rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.6rem 0.75rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
      display: none;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main id="login">
    <div class="lock">&#128274;</div>
    <h1>Iniciar sesi&oacute;n</h1>
    <p>Conexi&oacute;n cifrada mediante SSL/TLS.</p>
    <div class="card">
      <div class="error" id="error">Usuario o contrase&ntilde;a incorrectos.</div>
      <label for="user">Usuario</label>
      <input type="text" id="user" autocomplete="username">
      <label for="pass">Contrase&ntilde;a</label>
      <input type="password" id="pass" autocomplete="current-password">
      <button id="btn">Entrar</button>
    </div>
  </main>

  <main id="panel" class="hidden">
    <div class="lock">&#9989;</div>
    <h1>Bienvenido</h1>
    <p>Has iniciado sesi&oacute;n correctamente.</p>
    <p>Entrega escolar &mdash; demostraci&oacute;n de certificado SSL.</p>
  </main>

  <script>
    var USER = "admin";
    var PASS = "1234";

    var login = document.getElementById("login");
    var panel = document.getElementById("panel");
    var error = document.getElementById("error");
    var userInput = document.getElementById("user");
    var passInput = document.getElementById("pass");
    var btn = document.getElementById("btn");

    function doLogin() {
      if (userInput.value === USER && passInput.value === PASS) {
        login.classList.add("hidden");
        panel.classList.remove("hidden");
        error.style.display = "none";
      } else {
        error.style.display = "block";
        passInput.value = "";
      }
    }

    btn.addEventListener("click", doLogin);
    passInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
